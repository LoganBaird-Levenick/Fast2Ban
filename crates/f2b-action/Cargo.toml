[package]
name = "f2b-action"
description = "Fail2Ban-compatible action execution: shell commands, dynamic tag replacement, process groups, and action lifecycles"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
f2b-config = { path = "../f2b-config" }
f2b-helpers = { path = "../f2b-helpers" }
f2b-types = { path = "../f2b-types" }
f2b-regex = { path = "../f2b-regex" }
indexmap = "2"
log = "0.4"
regex = "1"
f2b-backend = { path = "../f2b-backend" }
f2b-filter = { path = "../f2b-filter" }

f2b-date = { path = "../f2b-date" }
tempfile = "3"
serde_json = "1"
f2b-expr = { path = "../f2b-expr" }
f2b-db = { path = "../f2b-db" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
