[package]
name = "f2b-db"
description = "SQLite database persistence for Fast2Ban: schema v4, migrations from v1/v2/v3, ban and log state"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
f2b-types = { path = "../f2b-types" }
indexmap = "2"
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
